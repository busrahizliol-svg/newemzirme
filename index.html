<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Emzirme Danışmanlığı Chatbotu</title>

<style>
body { font-family: system-ui; margin:0; background:#f6f7fb; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
.card { background:#fff; border-radius:16px; box-shadow: 0 6px 20px rgba(0,0,0,.06); overflow:hidden; }
header { padding:16px; border-bottom:1px solid #eee; }
.chat { padding:14px; height:60vh; overflow:auto; }
.msg { display:flex; margin:10px 0; }
.me { justify-content:flex-end; }
.bubble { padding:10px; border-radius:12px; background:#eee; }
.me .bubble { background:#111827; color:white; }
.foot { padding:12px; border-top:1px solid #eee; display:flex; gap:10px; }
.badge { font-size:12px; padding:6px; background:#eef2ff; }
</style>

</head>
<body>

<div class="wrap">
<div class="card">

<header>

<span class="badge">Emzirme Chatbotu</span>

<br><br>

Server:
<input id="server" value="https://newemzirme.onrender.com">

<button id="pingBtn">Bağlantı Testi</button>

<br><br>

PDF:
<input type="file" id="pdfFile" accept="application/pdf">

<button id="uploadBtn">PDF Yükle</button>

<span id="pdfStatus">PDF yok</span>

</header>

<div id="chat" class="chat"></div>

<div class="foot">

<input id="input">

<button id="sendBtn">Gönder</button>

</div>

</div>
</div>

<script>

const sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
localStorage.setItem("session_id", sessionId);

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const serverEl = document.getElementById("server");

const uploadBtn = document.getElementById("uploadBtn");
const pdfFileEl = document.getElementById("pdfFile");
const pdfStatusEl = document.getElementById("pdfStatus");

let vectorStoreId = localStorage.getItem("vector_store_id") || null;

if(vectorStoreId)
pdfStatusEl.textContent = "PDF hazır";

function addMsg(text, who="bot"){

const row=document.createElement("div");
row.className="msg "+(who=="me"?"me":"bot");

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=text;

row.appendChild(bubble);
chatEl.appendChild(row);

chatEl.scrollTop=chatEl.scrollHeight;

}

async function uploadPdf(){

const file=pdfFileEl.files[0];

if(!file){

alert("PDF seç");

return;

}

pdfStatusEl.textContent="Yükleniyor...";

const formData=new FormData();

formData.append("file",file);

const base=serverEl.value;

const r=await fetch(base+"/pdf/upload",{

method:"POST",

body:formData

});

const j=await r.json();

vectorStoreId=j.vector_store_id;

localStorage.setItem("vector_store_id",vectorStoreId);

pdfStatusEl.textContent="PDF hazır";

addMsg("PDF yüklendi. Artık PDF'den cevap verebilirim.");

}

async function send(){

const text=inputEl.value;

if(!text)return;

addMsg(text,"me");

inputEl.value="";

const base=serverEl.value;

const payload={

question:text,

session_id:sessionId,

vector_store_id:vectorStoreId

};

const r=await fetch(base+"/chat",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify(payload)

});

const j=await r.json();

addMsg(j.answer);

}

uploadBtn.onclick=uploadPdf;

sendBtn.onclick=send;

addMsg("Merhaba 💙 PDF yükleyebilir ve soru sorabilirsin.");

</script>

</body>
</html>
